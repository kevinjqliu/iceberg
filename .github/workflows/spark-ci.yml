name: "Spark CI"
on:
  push:
    branches:
    - 'main'
    - '0.*'
    - '1.*'
    - '2.*'
    tags:
    - 'apache-iceberg-**'
  pull_request:
    paths-ignore:
    - '.github/ISSUE_TEMPLATE/**'
    - '.github/workflows/api-binary-compatibility.yml'
    - '.github/workflows/delta-conversion-ci.yml'
    - '.github/workflows/docs-ci.yml'
    - '.github/workflows/flink-ci.yml'
    - '.github/workflows/hive-ci.yml'
    - '.github/workflows/java-ci.yml'
    - '.github/workflows/jmh-benchmarks-ci.yml'
    - '.github/workflows/kafka-connect-ci.yml'
    - '.github/workflows/cve-scan.yml'
    - '.github/workflows/labeler.yml'
    - '.github/workflows/license-check.yml'
    - '.github/workflows/open-api.yml'
    - '.github/workflows/pr-title-check.yml'
    - '.github/workflows/publish-snapshot.yml'
    - '.github/workflows/recurring-jmh-benchmarks.yml'
    - '.github/workflows/site-ci.yml'
    - '.github/workflows/stale.yml'
    - '.gitignore'
    - '.asf.yaml'
    - 'dev/**'
    - 'docker/**'
    - 'site/**'
    - 'mr/**'
    - 'flink/**'
    - 'kafka-connect/**'
    - 'docs/**'
    - 'open-api/**'
    - 'format/**'
    - '.gitattributes'
    - '**/README.md'
    - 'CONTRIBUTING.md'
    - '**/LICENSE'
    - '**/NOTICE'
    - 'doap.rdf'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spark-tests:
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 15
      matrix:
        jvm: [17]
        spark: ['3.5']
        scala: ['2.12']
        exclude:
          # Spark 3.5 is the first version not failing on Java 21 (https://issues.apache.org/jira/browse/SPARK-42369)
          # Full Java 21 support is coming in Spark 4 (https://issues.apache.org/jira/browse/SPARK-43831)
          - jvm: 21
            spark: '3.4'
          - spark: '4.0'
            scala: '2.12'
          - spark: '4.1'
            scala: '2.12'
    env:
      SPARK_LOCAL_IP: localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: ${{ matrix.jvm }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Read-only: java-ci's build-checks (17) is the global canonical writer.
          cache-read-only: true
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
      - run: echo -e "$(ip addr show eth0 | grep "inet\b" | awk '{print $2}' | cut -d/ -f1)\t$(hostname -f) $(hostname -s)" | sudo tee -a /etc/hosts
      - run: |
          ./gradlew -DsparkVersions=${{ matrix.spark }} -DscalaVersion=${{ matrix.scala }} -DflinkVersions= -DkafkaVersions= \
            :iceberg-spark:iceberg-spark-${{ matrix.spark }}_${{ matrix.scala }}:check \
            :iceberg-spark:iceberg-spark-extensions-${{ matrix.spark }}_${{ matrix.scala }}:check \
            :iceberg-spark:iceberg-spark-runtime-${{ matrix.spark }}_${{ matrix.scala }}:check \
            -Pquick=true -x javadoc
      - name: Summarize slowest Java tests
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          def escape_markdown(value):
              return str(value).replace("\\", "\\\\").replace("|", "\\|").replace("\n", " ")

          def classify_result(path):
              parts = path.split("/")
              build_index = parts.index("build")
              module_path = ":".join(parts[:build_index])
              test_task = parts[build_index + 2] if len(parts) > build_index + 2 else "unknown"

              if "iceberg-spark-runtime-" in module_path:
                  module_type = "runtime"
              elif "iceberg-spark-extensions-" in module_path:
                  module_type = "extensions"
              elif "iceberg-spark-" in module_path:
                  module_type = "spark"
              else:
                  module_type = "other"

              return module_type, module_path, test_task

          def test_status(test_case):
              if test_case.find("error") is not None:
                  return "error"
              elif test_case.find("failure") is not None:
                  return "failure"
              elif test_case.find("skipped") is not None:
                  return "skipped"
              else:
                  return "passed"

          results = []
          for path in glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except (ET.ParseError, ValueError):
                  continue

              for test_case in root.iter("testcase"):
                  try:
                      time = float(test_case.attrib.get("time", "0"))
                  except ValueError:
                      time = 0.0

                  classname = test_case.attrib.get("classname", "")
                  name = test_case.attrib.get("name", "")
                  module_type, module_path, test_task = classify_result(path)
                  results.append(
                      {
                          "time": time,
                          "classname": classname,
                          "name": name,
                          "module_type": module_type,
                          "module_path": module_path,
                          "test_task": test_task,
                          "status": test_status(test_case),
                          "path": path,
                      }
                  )

          results.sort(reverse=True, key=lambda result: result["time"])
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write(
                  "## Slowest Java tests "
                  "(JVM ${{ matrix.jvm }}, Spark ${{ matrix.spark }}, Scala ${{ matrix.scala }})\n\n"
              )

              if not results:
                  summary.write("No JUnit XML test cases found.\n")
              else:
                  slowest = results[0]
                  slowest_name = (
                      f"{slowest['classname']}.{slowest['name']}"
                      if slowest["classname"]
                      else slowest["name"]
                  )
                  summary.write("### Slowest test\n\n")
                  summary.write(f"- Test: `{escape_markdown(slowest_name)}`\n")
                  summary.write(f"- Time: `{slowest['time']:.3f}s`\n")
                  summary.write(f"- Classification: `{slowest['module_type']}`\n")
                  summary.write(f"- Module: `{escape_markdown(slowest['module_path'])}`\n")
                  summary.write(f"- Gradle test task: `{escape_markdown(slowest['test_task'])}`\n")
                  summary.write(f"- Status: `{slowest['status']}`\n\n")
                  summary.write("### Top 50 slowest tests\n\n")
                  summary.write(
                      "| Rank | Time (s) | Classification | Module | Test task | Status | Test case | XML |\n"
                  )
                  summary.write("| ---: | ---: | --- | --- | --- | --- | --- | --- |\n")
                  for index, result in enumerate(results[:50], start=1):
                      test_name = (
                          f"{result['classname']}.{result['name']}"
                          if result["classname"]
                          else result["name"]
                      )
                      summary.write(
                          f"| {index} | {result['time']:.3f} | {result['module_type']} | "
                          f"{escape_markdown(result['module_path'])} | "
                          f"{escape_markdown(result['test_task'])} | {result['status']} | "
                          f"{escape_markdown(test_name)} | {escape_markdown(result['path'])} |\n"
                      )
          PY
      - name: Upload JUnit test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-test-results-jvm-${{ matrix.jvm }}-spark-${{ matrix.spark }}-scala-${{ matrix.scala }}-attempt-${{ github.run_attempt }}
          path: |
            **/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test logs
          path: |
            **/build/testlogs
